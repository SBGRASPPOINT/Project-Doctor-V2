spring.application.name=vobiz-call-masking
server.port=${PORT:8080}

# --- PostgreSQL (docker-compose.yml provides a matching local instance) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vobiz_masking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10

# --- JPA: the schema is generated from the @Entity classes in model/ (no schema.sql) ---
# update = create missing tables/columns on boot, keep existing data; seed rows come from DataSeeder
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Vobiz REST credentials (only used for outbound click-to-call) ---
vobiz.auth-id=${VOBIZ_AUTH_ID:}
vobiz.auth-token=${VOBIZ_AUTH_TOKEN:}
vobiz.api-base=${VOBIZ_API_BASE:https://api.vobiz.example.com}
# true = log outbound calls instead of calling the Vobiz API (default until credentials are set)
vobiz.mock=${VOBIZ_MOCK:true}

# --- Public base URL of THIS service; Vobiz must reach it over HTTPS in production ---
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
# Fallback masked DID (M1); the settings table value wins once edited in the UI
app.default-m1-number=${M1_NUMBER:+10000000000}
