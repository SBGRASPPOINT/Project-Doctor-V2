spring.application.name=appointment-service
server.port=${PORT:8080}

# --- PostgreSQL (docker-compose.yml provides a matching local instance) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appointment}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10

# --- JPA: the schema is generated from the @Entity classes in model/ (no schema.sql) ---
# update = create missing tables/columns on boot, keep existing data (development default).
# Production: set DDL_AUTO=validate and manage the schema with migrations — see
# "Schema and migrations" in README.md (scripts/dump-schema.sh produces the baseline).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Vobiz REST APIs (voice + WhatsApp Messaging API) ---
vobiz.auth-id=${VOBIZ_AUTH_ID:}
vobiz.auth-token=${VOBIZ_AUTH_TOKEN:}
vobiz.api-base=${VOBIZ_API_BASE:https://api.vobiz.ai}
vobiz.whatsapp-channel-id=${VOBIZ_WHATSAPP_CHANNEL_ID:}
vobiz.whatsapp-waba-id=${VOBIZ_WHATSAPP_WABA_ID:}
vobiz.whatsapp-number=${VOBIZ_WHATSAPP_NUMBER:}
vobiz.whatsapp-webhook-secret=${VOBIZ_WHATSAPP_WEBHOOK_SECRET:}
# true = log/mock outbound Vobiz calls and messages instead of contacting Vobiz
vobiz.mock=${VOBIZ_MOCK:true}

# --- Public base URL of THIS service; Vobiz must reach it over HTTPS in production ---
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# --- Security: set both before exposing this service to the internet ---
# Bearer token required by /api/** (the ops console asks for it and keeps it in sessionStorage).
app.api-token=${API_TOKEN:}
# Shared secret appended to every /voice/** URL handed to Vobiz (?secret= / X-Webhook-Secret).
app.webhook-secret=${WEBHOOK_SECRET:}
# Fail startup when the configuration still looks like a local placeholder (set true in production).
app.require-production-config=${APP_REQUIRE_PRODUCTION_CONFIG:false}
# Seed demo agents/doctor/patient. NEVER enable against a live database.
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}

# --- Reminder scheduler ---
app.reminder-scheduler-enabled=${REMINDER_SCHEDULER_ENABLED:true}
# Fallback masked DID (M1); the settings table value wins once edited in the UI
app.default-m1-number=${M1_NUMBER:+10000000000}
