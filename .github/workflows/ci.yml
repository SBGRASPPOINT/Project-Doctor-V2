name: CI

# Nothing ran the tests before this workflow existed, which is how a non-compiling module and
# two always-400 console options survived. Keep it fast: one Java job, one JS syntax job.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: appointment-service (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appointment
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile + unit tests
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: appointment/build/reports/tests/
          retention-days: 7

  postgres-integration:
    name: schema boots against PostgreSQL
    runs-on: ubuntu-latest
    needs: java
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d appointment"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: appointment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Boots the real app: Hibernate creates the schema from the @Entity classes, the seeder
      # runs, and the context only becomes healthy if the mappings and data source are valid.
      - name: Boot with a real database and probe /health
        env:
          DB_URL: jdbc:postgresql://localhost:5432/appointment
          DB_USER: postgres
          DB_PASSWORD: postgres
          API_TOKEN: ci-token
          WEBHOOK_SECRET: ci-secret
        run: |
          ./gradlew --no-daemon bootRun --args='--server.port=8080' &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then echo "health OK"; exit 0; fi
            sleep 2
          done
          echo "service did not become healthy"; exit 1

  javascript:
    name: legacy pages (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check on every JS file
        run: |
          git ls-files '*.js' | while read -r f; do
            echo "checking $f"
            node --check "$f"
          done
